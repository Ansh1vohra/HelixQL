name: Release desktop client

# Publishing is driven by tags: push v0.1.0 and this builds every platform
# and attaches the installers to a GitHub Release. The control plane's
# /api/download/* routes resolve the newest release at request time, so the
# website starts serving a new version with no deploy of its own.
on:
  push:
    tags:
      - "v*"
  # Manual runs build and upload artifacts without publishing a release,
  # which is how you smoke-test a build before tagging.
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One platform failing should not discard the others' artifacts —
      # a macOS signing problem shouldn't cost you the Windows build.
      fail-fast: false
      matrix:
        include:
          # macOS installers can only be produced on macOS; Apple's toolchain
          # has no cross-compiler. This runner is the only way to ship a .dmg.
          - os: macos-latest
            command: build:mac
          # Windows builds natively here, which avoids the Wine dependency
          # that cross-building from Linux otherwise requires.
          - os: windows-latest
            command: build:win
          - os: ubuntu-latest
            command: build:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client-desktop/package-lock.json

      - name: Install dependencies
        working-directory: client-desktop
        run: npm ci

      # Catches a broken build before it is packaged into an installer that
      # only fails once a user has downloaded it.
      - name: Typecheck and test
        working-directory: client-desktop
        run: |
          npm run typecheck
          npm test

      - name: Build installers
        working-directory: client-desktop
        env:
          # electron-builder publishes to the Release itself when a token is
          # present; this is provided automatically to the workflow.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Code signing (optional) ---
          # Without these the build still succeeds, but Windows shows a
          # SmartScreen warning and macOS Gatekeeper refuses to open the app
          # on other people's machines. See the download docs.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run ${{ matrix.command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          # Only the distributable installers — the unpacked directories are
          # build intermediates and would multiply the upload for nothing.
          path: |
            client-desktop/dist/*.exe
            client-desktop/dist/*.dmg
            client-desktop/dist/*.AppImage
            client-desktop/dist/*.deb
          if-no-files-found: error

  publish:
    # Only tags publish; manual runs stop after building so a test build
    # never replaces what the website is serving.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The manifest is what the control plane reads; the installers are
      # just files next to it. Built here rather than per-platform because
      # only this job can see every artifact at once.
      - name: Build release manifest
        run: |
          set -euo pipefail
          cd artifacts
          ls -la

          python3 - "${GITHUB_REF_NAME}" <<'PY'
          import hashlib, json, os, re, sys

          version = sys.argv[1]

          # Maps a file to the platform key the download route asks for.
          # Ordered: the first pattern that matches wins, so the more
          # specific mac patterns are checked before any generic fallback.
          patterns = [
              ("windows",        re.compile(r"-setup\.exe$", re.I)),
              ("mac-arm64",      re.compile(r"-arm64\.dmg$", re.I)),
              ("mac-x64",        re.compile(r"-x64\.dmg$", re.I)),
              ("linux-appimage", re.compile(r"\.AppImage$", re.I)),
              ("linux-deb",      re.compile(r"\.deb$", re.I)),
          ]

          files = {}
          for name in sorted(os.listdir(".")):
              if not os.path.isfile(name):
                  continue
              for key, pattern in patterns:
                  if pattern.search(name):
                      if key in files:
                          raise SystemExit(f"two files matched {key}: {files[key]['name']} and {name}")
                      digest = hashlib.sha256()
                      with open(name, "rb") as handle:
                          for chunk in iter(lambda: handle.read(1 << 20), b""):
                              digest.update(chunk)
                      files[key] = {
                          "name": name,
                          "size": os.path.getsize(name),
                          "sha256": digest.hexdigest(),
                      }
                      break

          if not files:
              raise SystemExit("no installers matched any platform pattern — refusing to publish an empty manifest")

          manifest = {"version": version, "files": files}
          with open("latest.json", "w") as handle:
              json.dump(manifest, handle, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      # R2 speaks the S3 API, so the standard AWS CLI works against it. The
      # same step targets S3 by dropping --endpoint-url.
      - name: Upload installers to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          cd artifacts

          # Installers first, manifest last. The manifest is what makes a
          # version visible to the website, so publishing it before its
          # files are uploaded would advertise downloads that 404.
          for file in *.exe *.dmg *.AppImage *.deb; do
            [ -e "$file" ] || continue
            echo "uploading $file"
            aws s3 cp "$file" "s3://${R2_BUCKET}/$file" \
              --endpoint-url "$R2_ENDPOINT" \
              --cache-control "public, max-age=31536000, immutable"
          done

          # Short cache: this file is how a new release becomes visible, and
          # the control plane already caches it for ten minutes of its own.
          aws s3 cp latest.json "s3://${R2_BUCKET}/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control "public, max-age=60"
